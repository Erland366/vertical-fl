[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vertical-fl"
version = "1.0.0"
description = "PyTorch Vertical FL with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.16.0",
    "flwr-datasets>=0.5.0",
    "pandas==2.2.3",
    "numpy>=1.26.0",
    "scikit-learn==1.5.0",
    "torch==2.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "vertical_fl.server_app:app"
clientapp = "vertical_fl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 100
train.learning-rate = 5e-5
train.batch-size = 128 # Fit on RTX4090
use-fixed-data = true # IMPORTANT: Use fixed data for paired batches
aggregate-strategy = "reduce" # Or "gather", depends on the original code path, check strategy.py

log.project_name = "VFL-CLIP-Attack" # New project name for attack experiments
log.run_name = "Attack-SideData{size}" # Use run name template for Wandb

# Attack Configuration
attack.model_path = "attack_models/attack_model_sidesize_10.pth" # Placeholder, replace {size} or manage dynamically
attack.side_data_size = 100 # Placeholder, configure this for experiments

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2 # Note that this example will require changes to how VFL is implemented
options.backend.client-resources.num-gpus = 1.0
options.backend.client-resources.num-cpus = 4
